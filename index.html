<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Art Museum — Virtual Experience</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#171512;color:#fff;font-family:Arial,sans-serif}
#canvas-container{position:fixed;inset:0}
canvas{display:block;width:100%;height:100%}
.topbar{position:fixed;z-index:3;top:0;left:0;width:100%;padding:26px 5%;display:flex;justify-content:space-between;align-items:center;pointer-events:none}
.logo{font-size:17px;font-weight:700;letter-spacing:4px}.logo span{color:#c8a66a}
.top-menu,.bottom-info,.eyebrow,.scroll-indicator{font-size:10px;letter-spacing:3px;color:#d0c4af}
.intro{position:fixed;z-index:2;top:50%;left:9%;transform:translateY(-50%);pointer-events:none;transition:opacity .2s}
.eyebrow{color:#d0ae70;margin-bottom:22px}
h1{font-size:clamp(58px,9vw,116px);line-height:.92;letter-spacing:-5px}
h1 span{color:#c8a66a}
.subtitle{margin-top:22px;color:#d0c4af;font-size:14px;letter-spacing:1px}
.scroll-indicator{margin-top:55px}.scroll-line{height:1px;width:68px;background:#c8a66a;margin-top:14px}
.progress{position:fixed;z-index:3;right:28px;top:50%;height:145px;width:2px;background:#655d50;transform:translateY(-50%)}
#progress-bar{height:0;width:100%;background:#d5b16d}
.bottom-info{position:fixed;z-index:3;bottom:23px;left:5%;right:5%;display:flex;justify-content:space-between;pointer-events:none}
.hint{position:fixed;z-index:3;bottom:58px;left:50%;transform:translateX(-50%);font-size:10px;letter-spacing:1px;color:#e4d5b9;background:#171512aa;padding:10px 15px;border:1px solid #8f7449;border-radius:20px;white-space:nowrap;transition:opacity .5s}
.art-info{display:none;position:fixed;z-index:5;right:5%;bottom:10%;width:min(340px,88vw);padding:26px;background:#171512f2;border:1px solid #a88a55;box-shadow:0 12px 50px #0008}
.art-info p{font-size:9px;letter-spacing:3px;color:#c8a66a}.art-info h2{font:28px Georgia,serif;margin:13px 0}
#art-description{font-size:13px;line-height:1.6;color:#d2c9bb}
#close-art{float:right;border:0;background:none;color:white;font-size:27px;cursor:pointer}
#scroll-track{position:fixed;inset:0;z-index:0;overflow-y:auto;pointer-events:auto;scrollbar-width:none}
#scroll-track::-webkit-scrollbar{display:none}
#scroll-spacer{height:520vh;width:1px}
#canvas-container{pointer-events:none}
#canvas-container canvas{pointer-events:auto}
@media(max-width:600px){.topbar{padding:20px 6%}.top-menu{font-size:8px;letter-spacing:1px}.intro{left:7%}h1{font-size:65px}.progress{right:12px}.bottom-info{font-size:8px;letter-spacing:1px}}
</style>
<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js"}}
</script>
</head>
<body>
<div id="canvas-container"></div>
<div class="topbar"><div class="logo">THE ART <span>MUSEUM</span></div><div class="top-menu">VIRTUAL EXHIBITION · 2026</div></div>
<section class="intro" id="intro">
  <p class="eyebrow">WELCOME TO OUR WORLD</p>
  <h1>ART IS A<br><span>JOURNEY.</span></h1>
  <p class="subtitle">Explore creativity beyond boundaries.</p>
  <div class="scroll-indicator">SCROLL TO EXPLORE<div class="scroll-line"></div></div>
</section>
<div class="progress"><div id="progress-bar"></div></div>
<div class="bottom-info"><span>IMMERSIVE ART EXPERIENCE</span><span id="progress-text">00%</span></div>
<div class="hint" id="hint">Scroll to walk through the gallery · Click a painting to explore</div>
<div class="art-info" id="art-info"><button id="close-art">×</button><p>ART COLLECTION</p><h2 id="art-title">Artwork</h2><div id="art-description"></div></div>
<div id="scroll-track"><div id="scroll-spacer"></div></div>
<script type="module">
import * as THREE from "three";

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x171512);
scene.fog = new THREE.Fog(0x171512, 23, 88);

const camera = new THREE.PerspectiveCamera(66, innerWidth/innerHeight, .1, 150);
camera.position.set(0,1.7,9);
camera.lookAt(0,1.7,-12);

const renderer = new THREE.WebGLRenderer({antialias:true, powerPreference:"high-performance"});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,1.6));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.querySelector("#canvas-container").appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xd9d8e2,0x554332,1.7));
const ambient = new THREE.AmbientLight(0xffe2b5,.55); scene.add(ambient);
const key = new THREE.DirectionalLight(0xffe2c0,2.0); key.position.set(-2,8,5); scene.add(key);

const wallMat = new THREE.MeshStandardMaterial({color:0x77716a,roughness:.92});
const floorMat = new THREE.MeshStandardMaterial({color:0x887e70,roughness:.32,metalness:.08});
const ceilingMat = new THREE.MeshStandardMaterial({color:0x292622,roughness:.9});
const goldMat = new THREE.MeshStandardMaterial({color:0xb38d50,metalness:.72,roughness:.3});

function box(w,h,d,mat,x,y,z,cast=false,receive=false){
  const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat);
  m.position.set(x,y,z);m.castShadow=cast;m.receiveShadow=receive;scene.add(m);return m;
}

// Continuous museum architecture
box(12,.22,100,floorMat,0,-.12,-40,false,true);
box(12,.18,100,ceilingMat,0,7.05,-40);
box(.18,7,100,wallMat,-6,3.5,-40,false,true);
box(.18,7,100,wallMat,6,3.5,-40,false,true);

// Subtle floor inlay lines
const lineMat=new THREE.MeshStandardMaterial({color:0xb59a6c,metalness:.5,roughness:.45});
for(let x=-4;x<=4;x+=2) box(.018,.012,98,lineMat,x,.002,-40);
for(let z=5;z>=-88;z-=5) box(11.8,.012,.018,lineMat,0,.003,z);

// Ceiling trim and repeating lights
for(let z=3;z>=-85;z-=10){
  box(10,.045,.12,goldMat,0,6.88,z);
  for(const x of [-3.8,3.8]){
    const lamp= new THREE.Mesh(new THREE.BoxGeometry(.75,.08,.75),new THREE.MeshStandardMaterial({color:0xe8d4a8,emissive:0x8e6a32,emissiveIntensity:.55}));
    lamp.position.set(x,6.91,z-1.5);scene.add(lamp);
    const light=new THREE.SpotLight(0xffdca6,42,12,.58,.65,1.4);
    light.position.set(x,6.55,z-1.5);
    light.target.position.set(x<0?-5.72:5.72,3.1,z-2.5);
    scene.add(light,light.target);
  }
}

// End wall gives the corridor a destination
box(12,7,.25,wallMat,0,3.5,-91);
const endGlow=new THREE.PointLight(0xc89b5d,18,24);endGlow.position.set(0,4,-87);scene.add(endGlow);

// Procedural abstract painting textures
const palettes=[
 ["#a45b3e","#e5b66c","#282b36"],["#283e50","#b88a58","#d6c8ad"],
 ["#7c3541","#e0a96d","#393044"],["#315c50","#d6b36b","#b1a4a0"],
 ["#4b354d","#d69a75","#e5d7bb"],["#6e4937","#d9b36c","#303d48"]
];
function artworkTexture(index){
 const c=document.createElement("canvas");c.width=512;c.height=650;
 const g=c.getContext("2d"),p=palettes[index%palettes.length];
 g.fillStyle=p[0];g.fillRect(0,0,512,650);
 const grad=g.createLinearGradient(0,0,512,650);grad.addColorStop(0,p[1]);grad.addColorStop(1,p[2]);
 g.fillStyle=grad;g.fillRect(28,28,456,594);
 for(let i=0;i<22;i++){
   g.save();g.translate(35+(i*71)%440,35+(i*97)%560);g.rotate(i*.43);
   g.globalAlpha=.45+(i%4)*.1;g.fillStyle=p[i%3];
   if(i%3===0){g.beginPath();g.arc(0,0,24+(i%5)*9,0,Math.PI*2);g.fill();}
   else {g.fillRect(-18,-55,36,110);}
   g.restore();
 }
 g.globalAlpha=1;
 const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;return t;
}

const clickable=[];
function addPainting(side,z,index){
 const group=new THREE.Group();
 group.position.set(side*5.86,3.55,z);
 group.rotation.y=side<0?Math.PI/2:-Math.PI/2;
 const fw=2.55,fh=3.3,b=.13;
 function part(w,h,x,y){
  const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,.16),goldMat);
  m.position.set(x,y,0);m.castShadow=true;group.add(m);
 }
 part(fw,b,0,fh/2);part(fw,b,0,-fh/2);part(b,fh,-fw/2,0);part(b,fh,fw/2,0);
 const inner=new THREE.Mesh(new THREE.PlaneGeometry(2.27,3.02),new THREE.MeshStandardMaterial({map:artworkTexture(index),roughness:.82}));
 inner.position.z=.087;inner.userData={title:["The Golden Hour","Silent Geometry","Beyond the Blue","Garden of Dreams","Fragments of Light","The Last Summer"][index%6],description:"An original abstract artwork created for this virtual exhibition. Click another painting to continue exploring the collection."};
 group.add(inner);scene.add(group);clickable.push(inner);
 // Small brass plaque below each frame
 const plaque=box(.9,.18,.055,goldMat,0,0,0);plaque.position.set(side*5.77,1.72,z);
 const spot=new THREE.SpotLight(0xffdfae,24,8,.55,.75,1.2);
 spot.position.set(side*5.1,5.85,z+.3);
 spot.target.position.set(side*5.72,3.5,z);
 scene.add(spot,spot.target);
}
let n=0;
for(let z=-2;z>=-82;z-=9){addPainting(-1,z,n++);addPainting(1,z,n++);}

// Artwork click interaction
const raycaster=new THREE.Raycaster(),mouse=new THREE.Vector2();
renderer.domElement.addEventListener("click",e=>{
 mouse.x=e.clientX/innerWidth*2-1;mouse.y=-(e.clientY/innerHeight)*2+1;
 raycaster.setFromCamera(mouse,camera);
 const hit=raycaster.intersectObjects(clickable);
 if(hit.length){
  document.querySelector("#art-title").textContent=hit[0].object.userData.title;
  document.querySelector("#art-description").textContent=hit[0].object.userData.description;
  document.querySelector("#art-info").style.display="block";
 }
});
document.querySelector("#close-art").onclick=()=>document.querySelector("#art-info").style.display="none";

// Scroll-controlled camera walk
const track=document.querySelector("#scroll-track");
let targetProgress=0,currentProgress=0;
track.addEventListener("scroll",()=>{
 targetProgress=track.scrollTop/(track.scrollHeight-track.clientHeight);
 document.querySelector("#progress-bar").style.height=(targetProgress*100)+"%";
 document.querySelector("#progress-text").textContent=Math.round(targetProgress*100).toString().padStart(2,"0")+"%";
 document.querySelector("#intro").style.opacity=String(Math.max(0,1-targetProgress*5));
 document.querySelector("#hint").style.opacity=targetProgress>.04?"0":"1";
},{passive:true});

function animate(){
 requestAnimationFrame(animate);
 currentProgress+=(targetProgress-currentProgress)*.09;
 const z=THREE.MathUtils.lerp(9,-83,currentProgress);
 camera.position.set(Math.sin(currentProgress*Math.PI)*.10,1.72,z);
 camera.lookAt(0,1.72,z-18);
 renderer.render(scene,camera);
}
animate();

addEventListener("resize",()=>{
 camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();
 renderer.setSize(innerWidth,innerHeight);
});
</script>
</body>
</html>
